<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step-up SIP Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #05080f;
            --card-bg: #0f1420;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; padding: 20px; line-height: 1.5; display: flex; flex-direction: column; }

        .dashboard { max-width: 1100px; margin: auto; display: grid; grid-template-columns: 1fr 380px; gap: 24px; flex-grow: 1; width: 100%; }

        .header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding: 10px 0 30px; }
        .header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; background: linear-gradient(to right, #fff, var(--accent-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .card { background: var(--card-bg); border-radius: 20px; padding: 24px; border: 1px solid var(--border); }
        
        /* Larger Investment Plan Container Only */
        .investment-plans-container { padding: 40px !important; } 
        
        .plan-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 24px; }
        
        /* Larger Plan Cards */
        .plan-card { position: relative; background: rgba(255, 255, 255, 0.02); padding: 35px; border-radius: 20px; border: 1px solid var(--border); transition: 0.2s; }
        .plan-card:hover { border-color: var(--accent); background: rgba(99, 102, 241, 0.03); }

        .field-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 10px; }
        .field label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
        
        .input-group { position: relative; display: flex; align-items: center; }
        input { width: 100%; background: #05080f; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; color: white; outline: none; font-size: 16px; transition: 0.2s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        
        .suffix { position: absolute; right: 16px; color: var(--text-dim); font-size: 14px; font-weight: 600; pointer-events: none; }

        .btn { border: none; padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-primary { background: var(--accent); color: white; width: 100%; }
        .btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
        .btn-ghost:hover { border-color: var(--accent); color: white; }
        
        .btn-container { position: relative; width: 100%; margin-top: 10px; }
        .badge-free { position: absolute; right: -8px; top: -8px; background: linear-gradient(135deg, #10b981, #059669); color: white; font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); pointer-events: none; z-index: 10; }

        .btn-remove { position: absolute; top: 16px; right: 16px; background: rgba(239, 68, 68, 0.1); color: var(--danger); width: 30px; height: 30px; border-radius: 8px; border: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .stats-card { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 24px; }
        .stat-item h4 { font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; }
        .stat-item p { font-size: 24px; font-weight: 700; }

        .donut-wrap { width: 180px; height: 180px; margin: 0 auto; position: relative; }
        .growth-badge { background: rgba(16, 185, 129, 0.1); color: var(--success); padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-top: 10px; display: inline-block; }

        .graph-section { grid-column: 1 / -1; height: 400px; display: none; margin-top: 10px; }

        .results-container { display: flex; flex-direction: column; gap: 20px; margin-top: 10px; }
        .results-row { display: grid; grid-template-columns: 1fr 1.2fr 1fr; align-items: center; gap: 10px; padding-top: 15px; border-top: 1px solid var(--border); }

        footer { text-align: center; padding: 30px 0; color: var(--text-dim); font-size: 13px; font-weight: 500; letter-spacing: 1px; }
        .author-name { color: var(--accent-light); font-weight: 700; }

        @media (max-width: 850px) { .dashboard { grid-template-columns: 1fr; } .stats-card { position: static; order: -1; } }
    </style>
</head>
<body>

<div class="dashboard">
    <header class="header">
        <h1>Step-up SIP Calculator</h1>
        <div class="field" style="width: 140px;">
            <label>Avg Return</label>
            <div class="input-group">
                <input type="number" id="return" value="12">
                <span class="suffix">%</span>
            </div>
        </div>
    </header>

    <div class="main-panel">
        <!-- Target: Only this card is increased in size -->
        <div class="card investment-plans-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="font-size: 20px;">Investment Plans</h3>
                <button class="btn btn-ghost" onclick="addSIP()">+ Add New Plan</button>
            </div>
            <div id="sipContainer" class="plan-grid"></div>
        </div>

        <div class="card graph-section" id="graphArea">
            <h3 style="font-size: 14px; margin-bottom: 15px; color: var(--text-dim);">Wealth Growth Analytics</h3>
            <canvas id="growthChart"></canvas>
        </div>
    </div>

    <div class="stats-card">
        <div class="card" style="text-align: center;">
            <div class="donut-wrap">
                <canvas id="donutChart"></canvas>
            </div>

            <div class="results-container">
                <div class="results-row">
                    <div class="stat-item" style="text-align: left;">
                        <h4>Invested</h4>
                        <p id="invested" style="font-size: 14px;">₹0</p>
                    </div>
                    <div class="stat-item" style="text-align: center; background: rgba(99, 102, 241, 0.05); padding: 10px; border-radius: 12px; border: 1px solid rgba(99, 102, 241, 0.2);">
                        <h4>Total Wealth</h4>
                        <p id="final" style="font-size: 18px; color: var(--accent-light);">₹0</p>
                        <div id="growthPct" class="growth-badge">0% Gain</div>
                    </div>
                    <div class="stat-item" style="text-align: right;">
                        <h4>Gains</h4>
                        <p id="returns" style="font-size: 14px; color: var(--success);">₹0</p>
                    </div>
                </div>
            </div>

            <button class="btn btn-primary" style="margin-top: 25px;" onclick="calculate()">Calculate Portfolio</button>
            
            <div class="btn-container">
                <div class="badge-free">Free</div>
                <button class="btn btn-ghost" style="width: 100%;" onclick="toggleGraphs()">View Analytics</button>
            </div>
        </div>
    </div>
</div>

<footer>
    Designed & Built by <span class="author-name">~buvi</span>
</footer>

<script>
    let donutChart, growthChart;
    let isGraphVisible = false;

    function init() {
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') calculate();
        });

        const ctxD = document.getElementById('donutChart').getContext('2d');
        donutChart = new Chart(ctxD, {
            type: 'doughnut',
            data: { labels: ['Invested', 'Gains'], datasets: [{ data: [1, 1], backgroundColor: ['#1e293b', '#6366f1'], borderWidth: 0 }] },
            options: { cutout: '82%', plugins: { legend: { display: false } } }
        });

        const ctxG = document.getElementById('growthChart').getContext('2d');
        growthChart = new Chart(ctxG, {
            type: 'line',
            data: { 
                labels: [], 
                datasets: [
                    { label: 'Invested Amount', data: [], borderColor: 'rgba(148, 163, 184, 0.5)', borderWidth: 2, borderDash: [5, 5], tension: 0.1, fill: false },
                    { label: 'Total Wealth', data: [], borderColor: '#6366f1', borderWidth: 3, tension: 0.4, fill: true, backgroundColor: 'rgba(99, 102, 241, 0.1)' }
                ] 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                scales: { 
                    x: { ticks: { color: '#94a3b8' }, grid: { display: false } }, 
                    y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } } 
                }, 
                plugins: { legend: { display: true, labels: { color: '#ffffff', boxWidth: 12, font: { size: 11 } } } } 
            }
        });

        addSIP();
    }

    function addSIP() {
        const div = document.createElement("div");
        div.className = "plan-card";
        div.innerHTML = `
            <button class="btn-remove" onclick="this.parentElement.remove(); calculate();">×</button>
            <div class="field-row">
                <div class="field">
                    <label>Monthly SIP</label>
                    <div class="input-group"><input type="number" class="sipAmount" value="500"></div>
                </div>
                <div class="field">
                    <label>Years</label>
                    <div class="input-group"><input type="number" class="sipYears" value="10"></div>
                </div>
                <div class="field">
                    <label>Step-up (Yearly)</label>
                    <div class="input-group"><input type="number" class="sipStep" value=""></div>
                </div>
            </div>
        `;
        document.getElementById("sipContainer").appendChild(div);
    }

    function toggleGraphs() {
        isGraphVisible = !isGraphVisible;
        document.getElementById('graphArea').style.display = isGraphVisible ? 'block' : 'none';
        if (isGraphVisible) calculate();
    }

    function calculate() {
        let annualRate = parseFloat(document.getElementById("return").value) || 0;
        let cards = document.querySelectorAll(".plan-card");
        let maxYears = 0;
        cards.forEach(c => { let y = parseInt(c.querySelector(".sipYears").value) || 0; if (y > maxYears) maxYears = y; });

        if (maxYears === 0) return;

        let yearlyInvested = new Array(maxYears).fill(0);
        let yearlyValue = new Array(maxYears).fill(0);

        cards.forEach(card => {
            let amount = parseFloat(card.querySelector(".sipAmount").value) || 0;
            let years = parseInt(card.querySelector(".sipYears").value) || 0;
            let stepInput = card.querySelector(".sipStep").value;
            let step = stepInput === "" ? 0 : parseFloat(stepInput);
            
            let currentMonthly = amount, totalV = 0, totalI = 0, mRate = annualRate / 12 / 100;

            for (let y = 0; y < years; y++) {
                for (let m = 0; m < 12; m++) { totalI += currentMonthly; totalV = (totalV + currentMonthly) * (1 + mRate); }
                yearlyInvested[y] += totalI; yearlyValue[y] += totalV; currentMonthly += step;
            }
            for (let y = years; y < maxYears; y++) {
                for (let m = 0; m < 12; m++) { totalV = totalV * (1 + mRate); }
                yearlyInvested[y] += totalI; yearlyValue[y] += totalV;
            }
        });

        let finalI = yearlyInvested[maxYears-1] || 0;
        let finalV = yearlyValue[maxYears-1] || 0;
        let finalG = finalV - finalI;
        
        document.getElementById("invested").innerText = "₹" + Math.round(finalI).toLocaleString('en-IN');
        document.getElementById("returns").innerText = "₹" + Math.round(finalG).toLocaleString('en-IN');
        document.getElementById("final").innerText = "₹" + Math.round(finalV).toLocaleString('en-IN');
        document.getElementById("growthPct").innerText = Math.round((finalG/finalV)*100) + "% Gain";

        donutChart.data.datasets[0].data = [finalI, finalG];
        donutChart.update();

        if (isGraphVisible) {
            growthChart.data.labels = Array.from({length: maxYears}, (_, i) => `Yr ${i+1}`);
            growthChart.data.datasets[0].data = yearlyInvested;
            growthChart.data.datasets[1].data = yearlyValue;
            growthChart.update();
        }
    }

    window.onload = init;
</script>
</body>
</html>
